name: Fetch Nissan Heritage Events

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Serialize runs so two overlapping jobs never race on the same push.
concurrency:
  group: fetch-nissan-events
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch booking events
        id: fetch
        run: node scripts/fetch-events.js >> "$GITHUB_OUTPUT"

      - name: Merge into month file
        run: |
          node scripts/merge-snapshot.js \
            "${{ steps.fetch.outputs.output_file }}" \
            "${{ steps.fetch.outputs.content_file }}" \
            "${{ steps.fetch.outputs.timestamp }}"

      - name: Detect new vacancies
        if: steps.fetch.outputs.success == 'true'
        id: detect
        run: |
          node scripts/detect-new-vacancies.js \
            "${{ steps.fetch.outputs.content_file }}" \
            "state/available-slots" >> "$GITHUB_OUTPUT"

      # Commit before notifying: if the push fails, the job stops here and the
      # next run re-detects the same slots, instead of sending a duplicate.
      - name: Commit and push
        run: node scripts/commit-and-push.js "${{ steps.fetch.outputs.timestamp }}"

      - name: Send notification
        if: steps.detect.outputs.has_new == 'true'
        # A failed notification shouldn't fail the run.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify.js "${{ steps.detect.outputs.message_file }}"
