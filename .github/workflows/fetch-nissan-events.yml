name: Fetch Nissan Heritage Events

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch booking events
        id: fetch
        run: bash scripts/fetch-events.sh

      - name: Merge into month file
        run: |
          bash scripts/merge-snapshot.sh \
            "${{ steps.fetch.outputs.output_file }}" \
            "${{ steps.fetch.outputs.content_file }}" \
            "${{ steps.fetch.outputs.timestamp }}"

      - name: Detect new vacancies
        if: steps.fetch.outputs.success == 'true'
        id: detect
        run: |
          bash scripts/detect-new-vacancies.sh \
            "${{ steps.fetch.outputs.content_file }}" \
            "state/available-slots.json"

      - name: Send notification
        if: steps.detect.outputs.has_new == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh /tmp/notify_message.txt

      - name: Commit and push
        run: bash scripts/commit-and-push.sh "${{ steps.fetch.outputs.timestamp }}"
