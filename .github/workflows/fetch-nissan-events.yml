name: Fetch Nissan Heritage Events

# Triggered externally by cron-job.org via the workflow_dispatch API, since
# GitHub's own `schedule` trigger is best-effort and often delayed or dropped.
on:
  workflow_dispatch:

# Serialize runs so two overlapping jobs never race on the same push.
concurrency:
  group: fetch-nissan-events
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch events and detect new vacancies
        id: detect
        run: node scripts/fetch-and-detect.js >> "$GITHUB_OUTPUT"

      # Commit before notifying: if the push fails, the job stops here and the
      # next run re-detects the same slots, instead of sending a duplicate.
      - name: Commit and push
        run: node scripts/commit-and-push.js "${{ steps.detect.outputs.timestamp }}"

      - name: Send notification
        if: steps.detect.outputs.has_new == 'true'
        # A failed notification shouldn't fail the run.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify.js "${{ steps.detect.outputs.message_file }}"
